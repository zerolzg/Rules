port: 6152
socks-port: 6153
mixed-port: 8899
ipv6: false
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: dler
experimental:
  ignore-resolve-fail: true

# Clash for Windows
cfw-latency-url: https://cp.cloudflare.com/generate_204
cfw-latency-timeout: 3000
cfw-latency-type: 1
cfw-conn-break-strategy: true

# Clash for Android
clash-for-android:
  ui-subtitle-pattern: "[\u4e00-\u9fa5]{2,4}"

# Stash
url-rewrite:
  - ^https?:\/\/(www.)?(g|google)\.cn https://www.google.com 302
  - ^https?:\/\/(ditu|maps).google\.cn https://maps.google.com 302

