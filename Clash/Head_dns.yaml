port: 6152
socks-port: 6153
mixed-port: 8899
ipv6: false
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: dler
experimental:
  ignore-resolve-fail: true

# Clash for Windows
cfw-latency-url: http://cp.cloudflare.com/generate_204
cfw-latency-timeout: 3000
cfw-latency-type: 1
cfw-conn-break-strategy: true

# Clash for Android
clash-for-android:
  ui-subtitle-pattern: "[\u4e00-\u9fa5]{2,4}"

# Stash
url-rewrite:
  - ^https?:\/\/(www.)?(g|google)\.cn https://www.google.com 302
  - ^https?:\/\/(ditu|maps).google\.cn https://maps.google.com 302

dns:
  enable: true
  ipv6: false
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "*.ntp.org"
    - "*.ip6.arpa"
    - "isatap"
    - "teredo.ipv6.microsoft.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
    - "*.apple.com"
    - "captive.apple.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 2400:3200::1
    - "2402:4e00::"
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - 140.205.1.13
    - 124.221.68.73:1053
  fallback: []
  fallback-filter:
    geoip: false
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - "::/128"
      - "::1/128"
      - "fe80::/10"
      - "64:ff9b::/96"
  direct-nameserver: []
  direct-nameserver-follow-policy: false
  respect-rules: true
  prefer-h3: false
  use-hosts: false
  use-system-hosts: false
