port: 6152
socks-port: 6153
mixed-port: 8899
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
secret: dler
experimental:
  ignore-resolve-fail: true

# Clash for Windows
cfw-latency-url: https://cp.cloudflare.com/generate_204
cfw-latency-timeout: 3000
cfw-latency-type: 1
cfw-conn-break-strategy: true

# Clash for Android
clash-for-android:
  ui-subtitle-pattern: "[\u4e00-\u9fa5]{2,4}"

# Stash
url-rewrite:
  - ^https?:\/\/(www.)?(g|google)\.cn https://www.google.com 302
  - ^https?:\/\/(ditu|maps).google\.cn https://maps.google.com 302

dns:
  enable: true
  ipv6: true
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
  default-nameserver:
    - 223.6.6.6
    - 8.8.8.8
    - 2400:3200::1
    - 2001:4860:4860::8888
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - 8.8.8.8
    - 1.1.1.1
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    +.cloud-nodes.com:
      - 140.205.1.13
      - 124.221.68.73:1053
  fallback: []
  fallback-filter:
    geoip: false
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
  direct-nameserver: []
  direct-nameserver-follow-policy: false
  respect-rules: false
  prefer-h3: false
  use-hosts: false
  use-system-hosts: false
