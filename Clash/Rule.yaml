# =============================================
# 编辑提示
# =============================================
# rule-providers:
#   - behavior: classical (普通域名/IP规则)
#   - behavior: domain (精确域名匹配, 效率更高)
#   - behavior: ipcidr (IP段匹配)
#
# rules:
#   - 规则类型: 匹配内容, 策略组
#   - 常用类型: RULE-SET, DOMAIN, DOMAIN-SUFFIX, DOMAIN-KEYWORD, GEOIP, GEOSITE, IP-CIDR, AND, PROCESS-NAME
#   - 策略组名称必须与 Proxy Groups 中定义的名称完全一致
#   - 越靠前的规则优先级越高
#   - 新增 provider 后，必须同步在 rule-providers 中添加 url 和 path
# =============================================

rules:
  # 拦截 QUIC 流量功能（强制谷歌/YouTube回退到TCP，防降速）
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  # 使用 Mihomo 内置的 geosite 拦截 BT 追踪器
  - "GEOSITE,category-pt,DIRECT"
  - "RULE-SET,AdBlock,AdBlock"
  - "RULE-SET,HTTPDNS,HTTPDNS"
  - "RULE-SET,Download,DIRECT"
  - "RULE-SET,Global Media,Global Media"
  - "RULE-SET,Asian Media,Asian Media"
  - "RULE-SET,CN Media,CN Media"
  - "RULE-SET,Telegram,Telegram"
  - "RULE-SET,Crypto,Crypto"
  - "RULE-SET,Microsoft,Microsoft"
  - "RULE-SET,Apple,Apple"
  - "RULE-SET,AI Suite,AI Suite"
  - "RULE-SET,PayPal,PayPal"
  - "RULE-SET,Scholar,Scholar"
  - "RULE-SET,Speedtest,Speedtest"
  - "RULE-SET,Steam,Steam"
  - "RULE-SET,miHoYo,miHoYo"
  - "RULE-SET,PROXY,Proxy"
  - "RULE-SET,Domestic,Domestic"
  - "RULE-SET,Domestic IPs,Domestic"
  - "RULE-SET,LAN,DIRECT"
  - "GEOIP,CN,Domestic"
  - "MATCH,Others"

rule-providers:
  AdBlock:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/zerolzg/Rules@main/Clash/Provider/AdBlock.yaml"
    path: ./Rules/AdBlock
    interval: 86400
  Download:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/zerolzg/Rules@main/Clash/Provider/Download.yaml"
    path: ./Rules/Download
    interval: 86400
  HTTPDNS:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/zerolzg/Rules@main/Clash/Provider/HTTPDNS.yaml"
    path: ./Rules/HTTPDNS
